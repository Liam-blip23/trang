<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Quản Lý Đơn Hàng</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background: #fdfdfd; }
    h1 { text-align: center; margin-bottom: 20px; }
    table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
    th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
    th { background: #f2f2f2; }
    tr:nth-child(even) { background: #f9f9f9; }
    button.delete { padding: 5px 10px; background: #dc3545; color: white; border: none; border-radius: 5px; cursor: pointer; }
    button.delete:hover { background: #c82333; }
    .items { margin-left: 10px; }
  </style>
</head>
<body>

<h1>Quản Lý Đơn Hàng</h1>

<table>
  <thead>
    <tr>
      <th>Họ và tên</th>
      <th>SĐT</th>
      <th>Địa chỉ</th>
      <th>Đơn hàng</th>
      <th>Tổng tiền</th>
      <th>Thời gian</th>
      <th>Hành động</th>
    </tr>
  </thead>
  <tbody id="ordersTable">
    <!-- Đơn hàng sẽ được load ở đây -->
  </tbody>
</table>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyCp6TNKfveeufiXmIdA77NRJE1XX8mML3c",
    authDomain: "order-system-6c566.firebaseapp.com",
    projectId: "order-system-6c566",
    storageBucket: "order-system-6c566.firebasestorage.app",
    messagingSenderId: "894961018592",
    appId: "1:894961018592:web:801304cc03327e33415285",
    measurementId: "G-114M4WWBE7"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  function loadOrders(){
    const tbody = document.getElementById('ordersTable');
    tbody.innerHTML = '';

    db.collection('orders').orderBy('timestamp','desc').onSnapshot(snapshot=>{
      tbody.innerHTML = '';
      snapshot.forEach(doc=>{
        const order = doc.data();
        const tr = document.createElement('tr');

        const itemsHtml = order.items.map(i=>`${i.name} (${i.size}) - ${i.price}k`).join('<br>');

        tr.innerHTML = `
          <td>${order.name}</td>
          <td>${order.phone}</td>
          <td>${order.address}</td>
          <td class="items">${itemsHtml}</td>
          <td>${order.total}k</td>
          <td>${order.timestamp ? order.timestamp.toDate().toLocaleString() : ''}</td>
          <td><button class="delete" onclick="deleteOrder('${doc.id}')">Xóa</button></td>
        `;

        tbody.appendChild(tr);
      });
    });
  }

  function deleteOrder(id){
    if(confirm("Bạn có chắc muốn xóa đơn hàng này?")){
      db.collection('orders').doc(id).delete()
        .then(()=>alert("Đã xóa đơn hàng"))
        .catch(err=>alert("Xảy ra lỗi: " + err));
    }
  }

  loadOrders();
</script>

</body>
</html>
